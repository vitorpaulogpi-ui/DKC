<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donkey Kong Country - Web Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <!-- Carrega o script do EmulatorJS vindo de uma CDN confiável -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // Configurações do emulador
        EJS_player = '#game';
        EJS_core = 'snes'; // Define o sistema como Super Nintendo
        EJS_gameName = 'Donkey Kong Country';
        EJS_color = '#006400'; // Cor temática (verde)
        EJS_startOnLoaded = true;
        
        // Caminho para o seu arquivo de jogo no repositório
        EJS_gameUrl = 'DKC.smc'; 
        
        // Caminho para os arquivos de sistema do emulador (carregados via CDN)
        EJS_pathtodata = 'https://jsdelivr.net';

        // Configuração específica para melhor usabilidade no celular
        EJS_VirtualGamepadSettings = {
            touchControls: true // Ativa os botões virtuais na tela para celular
        };
    </script>
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
