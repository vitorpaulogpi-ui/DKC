<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Donkey Kong Country - Web</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        // Configurações Globais do Emulador
        EJS_player = '#game';
        EJS_core = 'snes'; // Sistema: Super Nintendo
        EJS_gameName = 'Donkey Kong Country';
        EJS_color = '#006400';
        EJS_startOnLoaded = true;
        
        // Aponta para o arquivo DKC.smc que está na raiz do seu GitHub
        EJS_gameUrl = 'DKC.smc'; 
        
        // IMPORTANTE: Nova CDN oficial e estável do projeto EmulatorJS
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // Configuração otimizada para Celulares (Touch Screen)
        EJS_VirtualGamepadSettings = {
            touchControls: true
        };
    </script>
    
    <!-- Script carregador oficial -->
    <script src="https://emulatorjs.org"></script>

</body>
</html>
